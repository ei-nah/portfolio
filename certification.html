		<link rel="stylesheet" href="style.css">
	</head>

	<body class="bg-gradient-to-r from-[#143115] to-black">
		<header class="flex justify-end">
			<nav>
				<a href="index.html" class="text-sm md:text-xl">Home</a> 
				<a href="about.html" class="text-sm md:text-xl">About</a>

		<main class="content">

		<div class = "flex flex-wrap justify-center gap-12">
			<div class = "w-full sm:w-1/2 md:w-1/3 lg:w-1/4 p-4 text-center">
				<img src = "image/ms-word-associate.jpg" 
					class = "w-full rounded cursor-pointer" 
					onclick="openModal(this.src)">

				<a href="https://drive.google.com/file/d/15Gs7jHz96GDXmLwv5NYbtOZyupXPTOFl/view?usp=drive_link" 
					target="_blank" 
					class="block font-bold text-green-300 pt-2 underline">MS Word Associate</a>
				<p class="text-green-300">(Click the image to view certificate)</p>
			</div>

			<div class = "w-full sm:w-1/2 md:w-1/3 lg:w-1/4 p-4 text-center">
				<img src = "image/IT-specialist-java.jpg" 
					class = "w-full rounded cursor-pointer" 
					onclick="openModal(this.src)">

				<a href="https://drive.google.com/file/d/1cav5YocgFXmY7mhr7RxxZtsZW2xZCBFT/view?usp=drive_link" 
					target="_blank" 
					class="block font-bold text-green-300 pt-2 underline">IT Specialist in Java</a>
				<p class="text-green-300">(Click the image to view certificate)</p>
			</div>

			<div class = "w-full sm:w-1/2 md:w-1/3 lg:w-1/4 p-4 text-center">
				<img src = "image/ms-excel-associate.jpg" 
					class = "w-full rounded cursor-pointer" 
					onclick="openModal(this.src)">

			</div>
		</div>

	</body>
		<div id="imageModal" class="fixed inset-0 hidden bg-black/80 flex items-center justify-center z-50">
  			<img id="modalImg" class="max-w-[90%] max-h-[90%] rounded shadow-lg">
		</div>

		<script>
  			const modal = document.getElementById("imageModal");
  			const modalImg = document.getElementById("modalImg");

  			function openModal(src) {
    		modal.classList.remove("hidden");
    		modalImg.src = src;
  			}

  			modal.addEventListener("click", () => {
    		modal.classList.add("hidden");
 		 	});
		</script>
