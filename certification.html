<!DOCTYPE html>

<html>
	<head>
		<title> Stephanie Bernardo | Certifications </title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
		<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
		<link rel="stylesheet" href="style.css">
	</head>

	<body class="bg-gradient-to-br from-[#0f2a14] via-[#143115] to-black">
		<header>
			<nav class="p-5 bg-[#111d13] shadow sm:flex sm:items-center sm:justify-between">
				<div class="flex justify-between items-center ">
					<span class="text-2xl text-[#4a7c59] font-bold"> SAB </span>

					<span class="text-3xl cursor-pointer mx-2 sm:hidden block"> 
						<ion-icon name="menu" onclick="Menu(this)"></ion-icon>
					</span>
				</div>

				<ul class="sm:flex sm:items-center sm:static sm:opacity-100 sm:pointer-events-auto
				z-50 absolute bg-[#111d13] w-full left-0 sm:w-auto py-4 sm:py-0 pl-7 sm:pl-0 
				opacity-0 top-[-400px] pointer-events-none transition-all ease-in duration-500">
					<li class="mx-4 my-6 sm:my-0"> 
						<a href="index.html" class="text-xl text-[#4a7c59] hover:text-[#a1cca5] duration-500">Home</a> 
					</li>
					<li class="mx-4 my-6 sm:my-0"> 
						<a href="about.html" class="text-xl text-[#4a7c59] hover:text-[#a1cca5] duration-500">About</a> 
					</li>
					<li class="mx-4 my-6 sm:my-0"> 
						<a href="tech-stack.html" class="text-xl text-[#4a7c59] hover:text-[#a1cca5] duration-500">Tech Stack</a> 
					</li>
					<li class="mx-4 my-6 sm:my-0"> 
						<a href="certification.html" class="text-xl md:text-xl text-[#4a7c59] hover:text-[#a1cca5] font-bold duration-500">Certifications</a> 
					</li>
				</ul>
			</nav>
		</header>
		
		<main class="content p-6 text-white">
			<h1 style="text-align: center;" > Certifications </h1> 
		</main>

		<div class = "flex flex-wrap justify-center gap-12">
			<div class = "w-full sm:w-1/2 md:w-1/3 lg:w-1/4 p-4 aspect-[4/3] text-center">
				<img src = "image/ms-word-associate.jpg" 
					class = "rounded-lg cursor-pointer" 
					onclick="openModal(this.src)">

				<a href="https://www.certiport.com/portal/pages/credentialverification.aspx" 
					target="_blank" 
					class="block font-bold text-green-300 pt-2 underline">MS Word Associate</a>
				<p class="text-green-300">(Click the image to view certificate)</p>
			</div>

			<div class = "w-full sm:w-1/2 md:w-1/3 lg:w-1/4 p-4 text-center">
				<img src = "image/IT-specialist-java.jpg" 
					class = "rounded-lg cursor-pointer" 
					onclick="openModal(this.src)">

				<a href="https://www.certiport.com/portal/pages/credentialverification.aspx" 
					target="_blank" 
					class="block font-bold text-green-300 pt-2 underline">IT Specialist in Java</a>
				<p class="text-green-300">(Click the image to view certificate)</p>
			</div>

			<div class = "w-full sm:w-1/2 md:w-1/3 lg:w-1/4 p-4 text-center">
				<img src = "image/ms-excel-associate.jpg" 
					class = "rounded-lg cursor-pointer" 
					onclick="openModal(this.src)">

				<a href="https://www.certiport.com/portal/pages/credentialverification.aspx" 
					target="_blank" 
					class="block font-bold text-green-300 pt-2 underline">MS Excel Associate</a>
				<p class="text-green-300">(Click the image to view certificate)</p>
			</div>
		</div>

	</body>
		<div id="imageModal" class="fixed inset-0 hidden bg-black/80 flex items-center justify-center z-50">
  			<img id="modalImg" class="max-w-[90%] max-h-[90%] rounded shadow-lg">
		</div>

		<script>
  			const modal = document.getElementById("imageModal");
  			const modalImg = document.getElementById("modalImg");

  			function openModal(src) {
    		modal.classList.remove("hidden");
    		modalImg.src = src;
  			}

  			modal.addEventListener("click", () => {
    		modal.classList.add("hidden");
 		 	});
		</script>

		<script>
			function Menu(e){
    		let list = document.querySelector('ul');

    		if (window.innerWidth < 640) {
        		if(e.name === 'menu'){
            	e.name = "close";
            	list.classList.add('top-[80px]', 'opacity-100');
            	list.classList.remove('pointer-events-none');
        	} else {
            	e.name = "menu";
            	list.classList.remove('top-[80px]', 'opacity-100');
            	list.classList.add('pointer-events-none');
        		}
    		}
		}
		</script>
</html>
